name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The gate must judge pull requests too, or a Dependabot bump arrives with no
  # CI signal at all -- which is how this fleet reached 1,461 open PRs.
  pull_request:
    branches: [main]
  # So a deploy can be re-run by hand, and so the auto-merge job below has
  # something to dispatch. A merge made with GITHUB_TOKEN raises no push event.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # NOT a bare `pages`: with cancel-in-progress, a pull-request run would cancel
  # a live main deployment.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies exactly from the lockfile
        run: npm ci

      - name: Stamp the artifact with its exact source revision
        # §6 of the master template: a green run is not evidence that anything
        # shipped. This file is what the deploy job's verification step asks the
        # SERVED bytes for.
        run: |
          mkdir -p public
          printf '{"source_sha":"%s","repository":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" > public/deployment.json

      - name: Unit tests, including every RFC known-answer vector
        # Gates the whole suite, not the a11y half. A 2026-08-14 sweep found 29
        # repos whose deploy job ran `test:a11y` alone, so their cryptographic
        # suites never blocked a publish.
        #
        # §4.1e: A TEST STEP THAT RUNS ZERO TESTS EXITS 0, so the count is
        # asserted as well as the exit status. It is read from vitest's own
        # JSON report rather than grepped out of the console: the first version
        # of this step parsed the summary line, and in CI — no TTY, different
        # stream — it came back empty and failed the build saying "the unit
        # suite reported  tests". A check that cannot read its own input is
        # worse than no check, because the next person makes it lenient.
        run: npm run test:ci

      - name: Assert the unit suite actually ran its tests
        run: |
          set -eu
          node -e '
            const r = require("./vitest-report.json");
            console.log(`vitest: ${r.numPassedTests} passed, ${r.numFailedTests} failed, of ${r.numTotalTests}`);
            if (!r.success) { console.log("::error::the unit suite did not succeed"); process.exit(1); }
            if (r.numFailedTests !== 0) { console.log("::error::failed tests reported"); process.exit(1); }
            if (!(r.numPassedTests >= 200)) {
              console.log(`::error::the unit suite reported ${r.numPassedTests} passing tests; it should report at least 200`);
              process.exit(1);
            }
          '

      - name: Build (typecheck gates the build)
        run: npm run build

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  # The image carries the exact browser binaries and Linux libraries Playwright
  # expects. Pin the multi-architecture manifest by digest so the rendering
  # environment cannot drift under an unchanged commit -- which matters here
  # because the accessibility gate's non-text oracle measures painted pixels.
  #
  # THE TAG AND THE INSTALLED VERSION MUST AGREE, and the step below checks it
  # rather than trusting it. The first CI run of this lab failed exactly here:
  # the image was pinned at v1.64.0 while `^1.64.0` had resolved to 1.65.1,
  # whose browser build is `chromium_headless_shell-1255` and is not in that
  # image. Every test then failed in about a millisecond with
  # "Executable doesn't exist", which reads like a broken suite and is a broken
  # environment. Dependabot will bump @playwright/test again; when it does, the
  # check fails and the image tag and digest move with it, in one reviewed edit.
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    env:
      # The Actions runner mounts a HOME the browsers cannot use in-container.
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies exactly from the lockfile
        run: npm ci

      - name: The image's browsers must match the installed Playwright
        # Read from the installed package, compared against the tag above.
        # Without this, a version bump loses the browser binaries silently and
        # the gate's failure names the wrong subject.
        env:
          IMAGE_VERSION: '1.65.1'
        run: |
          set -eu
          installed=$(node -e 'process.stdout.write(require("@playwright/test/package.json").version)')
          echo "installed @playwright/test: $installed; image carries browsers for: $IMAGE_VERSION"
          if [ "$installed" != "$IMAGE_VERSION" ]; then
            echo "::error::@playwright/test is $installed but the container image is v$IMAGE_VERSION. Update the image tag AND its digest in this workflow together, then update IMAGE_VERSION."
            exit 1
          fi

      - name: Complete browser gate (accessibility, claims, verdict coverage)
        # All three projects in one invocation, deliberately: e2e/global-
        # teardown.ts fails the run when a recorded mutation kill never
        # executed, and that answer only means anything when the claims project
        # really ran.
        run: npx playwright test --reporter=list

  deploy:
    needs: [build, browser-gate]
    # NOT `== 'push'`. That also skips workflow_dispatch, which is the one
    # trigger the auto-merge job below depends on: the dispatched run would
    # build, pass the gate, and skip the deploy, so the site would never update.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Verify the served bytes match the deployed revision
        # A green run is not evidence that it shipped. Two labs in this fleet
        # sat for three months with every check green and a site that never
        # changed, because Pages was serving a branch while the workflow
        # uploaded an artifact. Ask the served bytes.
        env:
          LIVE_URL: https://systemslibrarian.github.io/crypto-lab-quic-packet/
        run: |
          set -eu
          for attempt in $(seq 1 18); do
            result=$(curl -fsSL --connect-timeout 8 --max-time 15 -H 'Cache-Control: no-cache' "${LIVE_URL}deployment.json?sha=${GITHUB_SHA}" 2>/dev/null || true)
            if node -e 'try { const p=JSON.parse(process.argv[1]);process.exit(p.source_sha===process.argv[2]&&p.repository===process.argv[3]?0:1) } catch { process.exit(1) }' "$result" "$GITHUB_SHA" "$GITHUB_REPOSITORY"; then
              html=$(curl -fsSL --connect-timeout 8 --max-time 15 -H 'Cache-Control: no-cache' "${LIVE_URL}?sha=${GITHUB_SHA}" 2>/dev/null || true)
              if printf '%s' "$html" | grep -Fq 'id="app"'; then
                echo "Verified live HTML and source revision $GITHUB_SHA at $LIVE_URL"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Live Pages failed source-SHA/HTML verification"
          exit 1

  # Dependabot only. The complete gate decides whether a bump is safe -- that is
  # the whole safety argument, and it is why `needs:` names both jobs: a major
  # that breaks the lab fails the gate and the pull request stays open for a
  # person. The gate a bump auto-merges against is the SAME gate the deploy
  # runs, so a bump cannot merge cleanly and then fail the publish.
  dependabot-auto-merge:
    needs: [build, browser-gate]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # actions: write is required for the deploy dispatch below. Without it
      # `gh workflow run` returns HTTP 403 "Resource not accessible by
      # integration", the merged bump never deploys, and a `|| echo` fallback
      # hides it.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: bump
        name: Read the bump type from the pull request itself
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        # No third-party action in the merge path, and no API call either: the
        # versions come from the pull request's own text, which the triggering
        # event already carries, judged by an in-repo script that answers
        # major / non-major / unknown. Only non-major merges; unknown waits for
        # a person, which is what a grouped pull request with no versions, a
        # retitled one, or a missing body all come to.
        #
        # The title and body are ATTACKER-CONTROLLED, so they reach the script
        # only through env and are never interpolated into this script. A ${{ }}
        # in a `run:` block is substituted before bash reads the line, so a
        # crafted title would become shell source; an env value is data to bash
        # and never source.
        run: |
          set -eu
          node .github/scripts/bump-type.mjs | tee -a "$GITHUB_OUTPUT"

      - name: Merge any bump whose gate went green
        if: steps.bump.outputs.bump == 'non-major'
        run: |
          set -eu
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::error::gate passed but the merge did not land after 3 attempts; the bump is unmerged and no deploy was dispatched"
            exit 1
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          #
          # Dispatch the file THIS lab has: most are deploy.yml, some deploy-pages.yml
          # or pages.yml. A copied name 404s only on the auto-merge path, after the
          # merge has landed. See §6.2.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
